[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setgrpo"
version = "0.1.0"
description = "Reference implementation of Set-Valued Group Relative Policy Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
test = ["pytest>=7"]
training = [
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "accelerate>=0.33",
  "hydra-core>=1.3",
  "ray[default]>=2.41",
  "pyarrow>=19",
]
verl = [
  "scipy>=1.10",
  "requests>=2.31",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "vllm>=0.8.5",
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "accelerate>=0.33",
  "hydra-core>=1.3",
  "ray[default]>=2.41",
  "pyarrow>=19",
]

[project.scripts]
setgrpo-calibrate = "setgrpo.cli:calibrate"
setgrpo-certify = "setgrpo.cli:certify"

[tool.setuptools.packages.find]
where = ["."]
include = ["setgrpo*", "verl*", "recipe*", "health_bench*", "eval*"]
